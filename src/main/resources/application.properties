spring.application.name=lab1
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/secure_api
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-secret-key-123456789}
jwt.expiration=${JWT_EXPIRATION:3600000}

logging.level.org.springframework.security=INFO
logging.level.com.example.secureapi=INFO